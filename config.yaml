# X/Twitter Reply Bot — Buffer API Edition
# Secrets are loaded from environment variables (.env file or system env)
# Never hardcode API keys here — use .env instead

# ── Buffer API ───────────────────────────────
buffer:
  api_key: "${BUFFER_API_KEY}"
  api_url: "https://api.buffer.com"
  channel_id: "${BUFFER_CHANNEL_ID}"
  mode: "${BUFFER_MODE:-addToQueue}"             # addToQueue | customScheduled | draft | shareNow

# ── X Accounts to track ──────────────────────
#
# STRATEGY: We use a hybrid approach for maximum coverage.
#
#   TYPE 1 — "native" feeds: Official RSS feeds published by news orgs on their
#            own websites. These are 100 % free and work forever.
#
#   TYPE 2 — "rsshub" feeds:  For X-only accounts (individuals, influencers)
#            that don't have a website RSS feed, we use RSSHub. You MUST either:
#              a) Self-host RSSHub (free, Docker) — see https://docs.rsshub.app
#              b) Use a public instance (unreliable, may break)
#            Set RSSHUB_BASE_URL in .env (default: https://rsshub.app)
#
#   TYPE 3 — "rssbridge" feeds: RSS-Bridge is another free self-hosted option.
#            Set RSSBRIDGE_BASE_URL in .env if you use it.
#
# TIP: To add a new X account, simply add a new entry below. If the account
#      belongs to an org with its own RSS, use the native URL. Otherwise use
#      the RSSHub pattern:  ${RSSHUB_BASE_URL}/twitter/user/<username>
#
# ─────────────────────────────────────────────

rsshub_base_url: "${RSSHUB_BASE_URL:-https://rsshub.app}"

