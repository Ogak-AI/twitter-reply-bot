# World Cup 2026 News Bot — Buffer API Edition
# Secrets are loaded from environment variables (.env file or system env)
# Never hardcode API keys here — use .env instead

# ── Buffer API ───────────────────────────────
buffer:
  api_key: "${BUFFER_API_KEY}"
  api_url: "https://api.buffer.com"
  channel_id: "${BUFFER_CHANNEL_ID}"
  mode: "${BUFFER_MODE:-addToQueue}"             # addToQueue | customScheduled | draft | shareNow

# ── Accounts / Topics to track ────────────────
#
# TOPIC: Strictly FIFA World Cup 2026 only.
# All feeds must relate to WC2026 news, teams, venues, matches, and players.
#
# STRATEGY: Since Twitter (X) blocks standard scraping (403/404 on public RSSHub/Nitter),
# we use a highly reliable, free, and robust dual-source approach:
#
#   1. NATIVE RSS: Official RSS feeds from news/sports sites (ESPN, BBC, etc.)
#      Fetched using a custom User-Agent to prevent WAF blocks.
#
#   2. GOOGLE NEWS RSS: We track World Cup 2026 keywords and sources
#      by scraping real-time Google News search feeds. Free, fast, and 100% stable.
#
# ──────────────────────────────────────────────

x_accounts:

  # ═══════════════════════════════════════════
  # FIFA World Cup 2026 — All Sources
  # ═══════════════════════════════════════════
  - username: "FIFA_WorldCup"
    category: "worldcup"
    rss_url: "https://news.google.com/rss/search?q=%22World+Cup+2026%22+OR+%22FIFA+World+Cup+2026%22&hl=en-US&gl=US&ceid=US:en"

  - username: "WorldCup_ESPN"
    category: "worldcup"
    rss_url: "https://news.google.com/rss/search?q=%22World+Cup+2026%22+site:espn.com&hl=en-US&gl=US&ceid=US:en"

  - username: "WorldCup_Sky"
    category: "worldcup"
    rss_url: "https://news.google.com/rss/search?q=%22World+Cup+2026%22+site:skysports.com&hl=en-US&gl=US&ceid=US:en"

  - username: "WorldCup_Athletic"
    category: "worldcup"
    rss_url: "https://news.google.com/rss/search?q=%22World+Cup+2026%22+site:theathletic.com&hl=en-US&gl=US&ceid=US:en"

  - username: "WorldCup_BBC"
    category: "worldcup"
    rss_url: "https://news.google.com/rss/search?q=%22World+Cup+2026%22+(site:bbc.co.uk+OR+site:bbc.com)&hl=en-US&gl=US&ceid=US:en"

  - username: "WorldCup_Venues"
    category: "worldcup"
    rss_url: "https://news.google.com/rss/search?q=%22World+Cup+2026%22+(stadium+OR+venue+OR+schedule)&hl=en-US&gl=US&ceid=US:en"

  - username: "WorldCup_Squads"
    category: "worldcup"
    rss_url: "https://news.google.com/rss/search?q=%22World+Cup+2026%22+(squad+OR+roster+OR+call-up+OR+transfer)&hl=en-US&gl=US&ceid=US:en"

  - username: "WorldCup_Matches"
    category: "worldcup"
    rss_url: "https://news.google.com/rss/search?q=%22World+Cup+2026%22+(match+OR+fixture+OR+result+OR+qualifying)&hl=en-US&gl=US&ceid=US:en"

# ── AI (tweet generation) ────────────────────
ai:
  provider: "${AI_PROVIDER:-groq}"    # groq only
  model: "${AI_MODEL:-llama-3.3-70b-versatile}"
  groq_api_key: "${GROQ_API_KEY:-}"
  max_tweet_length: 270

# ── Listener ─────────────────────────────────
listener:
  poll_interval_seconds: 90              # Check feeds every 90 seconds for speed
  max_article_age_hours: 0.5             # Only articles from the last 30 minutes

# ── Viral Content Filter ─────────────────────
viral:
  min_score: 7                           # Minimum viral score (1-10) to post — 7+ = high viral
  scorer_timeout: 8                      # Groq API timeout for viral scoring (seconds)

# ── Rate Limits & Throttling ─────────────────
limits:
  max_posts_per_24h: 50              # Fewer but higher-quality viral posts
  min_post_interval_seconds: 120     # 2-minute spacing — fast enough for breaking news

# ── Logging ──────────────────────────────────
logging:
  level: "${LOG_LEVEL:-INFO}"
  log_file: "logs/bot.log"
