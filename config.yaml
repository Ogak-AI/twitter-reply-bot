# X/Twitter Reply Bot — Buffer API Edition
# Secrets are loaded from environment variables (.env file or system env)
# Never hardcode API keys here — use .env instead

# ── Buffer API ───────────────────────────────
buffer:
  api_key: "${BUFFER_API_KEY}"
  api_url: "https://api.buffer.com"
  channel_id: "${BUFFER_CHANNEL_ID}"
  mode: "${BUFFER_MODE:-addToQueue}"             # addToQueue | customScheduled | draft | shareNow

# ── Accounts / Topics to track ────────────────
#
# STRATEGY: Since Twitter (X) blocks standard scraping (403/404 on public RSSHub/Nitter),
# we use a highly reliable, free, and robust dual-source approach:
#
#   1. NATIVE RSS: Official RSS feeds from news/sports sites (ESPN, Hoops Rumors, BBC, etc.)
#      Fetched using a custom User-Agent to prevent WAF blocks.
#
#   2. GOOGLE NEWS RSS: We track key individuals (Elon Musk, Sam Altman, Shams, Fabrizio)
#      by scraping real-time Google News search feeds. This is free, fast, and 100% stable.
#
# ──────────────────────────────────────────────

x_accounts: []

# ── AI (tweet generation) ────────────────────
ai:
  provider: "${AI_PROVIDER:-groq}"    # groq only
  model: "${AI_MODEL:-llama-3.3-70b-versatile}"
  groq_api_key: "${GROQ_API_KEY:-}"
  max_tweet_length: 270

# ── Listener ─────────────────────────────────
listener:
  poll_interval_seconds: 30
  max_article_age_hours: 2

# ── Logging ──────────────────────────────────
logging:
  level: "${LOG_LEVEL:-INFO}"
  log_file: "logs/bot.log"
