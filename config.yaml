# ── AI (tweet generation) ────────────────────
ai:
  provider: "${AI_PROVIDER:-groq}"    # groq only
  model: "${AI_MODEL:-llama-3.3-70b-versatile}"
  groq_api_key: "${GROQ_API_KEY:-}"
  max_tweet_length: 270

# ── Listener ─────────────────────────────────
listener:
  poll_interval_seconds: 600
  max_article_age_hours: 2

# ── Rate Limits & Throttling ─────────────────
limits:
  max_posts_per_24h: 95              # Maximum successful posts in a 24-hour rolling window
  min_post_interval_seconds: 900     # Minimum spacing between posts in seconds (15 minutes)

# ── Logging ──────────────────────────────────
logging:
  level: "${LOG_LEVEL:-INFO}"
  log_file: "logs/bot.log"
