# ── AI (tweet generation) ────────────────────
ai:
  provider: "${AI_PROVIDER:-groq}"    # groq only
  model: "${AI_MODEL:-llama-3.3-70b-versatile}"
  groq_api_key: "${GROQ_API_KEY:-}"
  max_tweet_length: 270

# ── Listener ─────────────────────────────────
listener:
  poll_interval_seconds: 30
  max_article_age_hours: 2

# ── Logging ──────────────────────────────────
logging:
  level: "${LOG_LEVEL:-INFO}"
  log_file: "logs/bot.log"
